<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>
    <link rel="icon" type="image/png" href="./assets/174854.png">
    <link rel="stylesheet" href="/practice-navbar-01/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
    <body>
        <!-- NAVIGATION BAR -->
        <nav>
            <div class="logo">
                <img src="./assets/174854.png" alt="html-logo">
                <h3>MyWebsite</h3>
            </div>
            <ul>    
                <li>
                    <a href="#">Home</a>
                </li>
                <li>
                    <a href="#">About</a>
                </li>
                <li>
                    <a href="#">Service</a>
                </li>
                <li>
                    <a href="#">Portfolio</a>
                </li>
                <li>
                    <a href="#">Contact</a>
                </li>
            </ul>
            <div class="button">
                <input type="search" placeholder="Search...">
                <button class="signin">Login</button>
                <button class="signup">Sign Up</button>
            </div>
        </nav>

        <!-- CONTENT -->
        <div class="merger-content">
            <div class="content">
                <h1>Bangun Masa Depan</h1>
                <h1>Digital Anda Bersama Kami</h1>

                <p>Kami membantu bisnis Anada berkembang melalui solusi teknologi modern dan strategi digital yang inovatif</p>
                <div class="button-merger">
                    <button class="mulai-button">Mulai Sekarang</button>
                    <button class="lanjut-button">Pelajari Lebih Lanjut</button>
                </div>
            </div>

            <div class="img">
                <img src="./assets/seo-87.png" alt="calling.png">
            </div>
        </div>

    </body>
</html>
